services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traditional_knowledge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pass123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traditional_knowledge_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build:
     context: ./ml-service
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend/backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/traditional_knowledge_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Pass123
      AI_BASE_URL: http://ai:8000
      AI_PREDICT_PATH: /predict
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:

