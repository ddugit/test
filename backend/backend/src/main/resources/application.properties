spring.application.name=backend

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/traditional_knowledge_db
spring.datasource.username=postgres
spring.datasource.password=Pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Secret (Move to environment variable in production)
app.jwtSecret=SecretKeyToGenJWTsTraditionalKnowledgeDigitalAI2024
app.jwtExpirationMs=86400000


# AI service (local FastAPI)
# Use explicit IPv4 to avoid Windows localhost/IPv6 (::1) mismatch
ai.base-url=http://127.0.0.1:8000
ai.predict-path=/predict

# Bind to all interfaces (WSL/Docker)
server.address=0.0.0.0
server.port=8080
