spring.application.name=backend

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/traditional_knowledge_db
spring.datasource.username=postgres
spring.datasource.password=Pass123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Secret (Move to environment variable in production)
app.jwtSecret=SecretKeyToGenJWTsTraditionalKnowledgeDigitalAI2024
app.jwtExpirationMs=86400000


# AI service (local FastAPI)
# Use environment variable AI_BASE_URL if provided, otherwise default to localhost
ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
ai.predict-path=${AI_PREDICT_PATH:/predict}

# Bind to all interfaces (WSL/Docker)
server.address=0.0.0.0
server.port=8080
